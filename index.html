 {key:'experience', t:'تجربة المريض', re:/complaint|families/i},
];
function kpiDomain(name){ const n=String(name||''); for(const d of DOMAINS){ if(d.re&&d.re.test(n)) return d; } return {key:'other',t:'مؤشرات أخرى'}; }

function indMonths(){ return [...((state.indicators&&state.indicators.months)||[])].sort((a,b)=>(b.monthISO||'').localeCompare(a.monthISO||'')); }
function indMonthsAsc(){ return indMonths().reverse(); }
function indActive(){ const ms=indMonths(); if(!ms.length)return null; return ms.find(m=>m.id===(state.indicators||{}).activeId)||ms[0]; }
function indActiveIdx(){ const asc=indMonthsAsc(); const a=indActive(); return asc.findIndex(m=>a&&m.id===a.id); }

function dirUp(target){ const t=String(target||''); if(/≤|<=|<|اقل|أقل/.test(t)&&!/≥|>=/.test(t)) return false; return true; }
function kpiStat(value,target){ const v=Number(value);
  if(value===''||value==null||isNaN(v)) return 'na';
  const t=String(target||'').trim(); if(!t||/^na$/i.test(t)||!/\d/.test(t)) return 'na';
  const nums=(t.match(/\d+(?:\.\d+)?/g)||[]).map(Number); if(!nums.length) return 'na';
  const lower=/≤|<=|<|اقل|أقل/.test(t)&&!/≥|>=/.test(t);
  const higher=/≥|>=|>|اكبر|أكبر|within|dispositi/.test(t)&&!lower;
  if(nums.length>=2 && !lower && !higher){ const a=nums[0],b=nums[1]; if(v>=a&&v<=b)return'good'; const m=((b-a)*0.15)||(a*0.1); return (v>=a-m&&v<=b+m)?'near':'bad'; }
  const n=nums[0];
  if(lower){ if(v<=n)return'good'; return v<=n*1.1?'near':'bad'; }
  if(v>=n)return'good'; return v>=n*0.9?'near':'bad';
}
const STAT={good:{t:'ضمن المستهدف',c:'var(--green)',chip:'green'},near:{t:'قريب من المستهدف',c:'var(--amber)',chip:'amber'},bad:{t:'خارج المستهدف',c:'var(--red)',chip:'red'},na:{t:'غير مقيّم',c:'var(--soft)',chip:'gray'}};
function fmtVal(k){ return (k.value===''||k.value==null)?'—':(esc(String(k.value))+(k.unit==='%'?'%':'')); }

function monthScore(m){ const ks=(m.kpis||[]).filter(k=>kpiStat(k.value,k.target)!=='na'); if(!ks.length)return null;
  const s=ks.reduce((a,k)=>{const st=kpiStat(k.value,k.target);return a+(st==='good'?100:st==='near'?60:0);},0); return Math.round(s/ks.length); }
function scoreColor(v){ return v>=80?'var(--green)':v>=55?'var(--amber)':'var(--red)'; }
function pxColor(v){ return v>=80?'var(--green)':v>=60?'var(--amber)':'var(--red)'; }

function kpiTrend(name){ return indMonthsAsc().map(m=>{ const k=(m.kpis||[]).find(x=>x.name===name); return {label:m.label, value:(k&&k.value!==''&&k.value!=null&&!isNaN(Number(k.value)))?Number(k.value):null}; }); }
function momentum(name,target){ const tr=kpiTrend(name).filter(p=>p.value!=null); if(tr.length<2)return '';
  const last=tr[tr.length-1].value, prev=tr[tr.length-2].value, diff=last-prev;
  if(Math.abs(diff)<1e-9) return '<span class="mom" style="color:var(--soft)">▬</span>';
  const up=dirUp(target), improving= up?diff>0:diff<0;
  return `<span class="mom" style="color:${improving?'var(--green)':'var(--red)'}" title="${improving?'يتحسّن نحو المستهدف':'يتراجع'}">${diff>0?'▲':'▼'}</span>`; }

/* ---- SVG charts (offline) ---- */
function svgLine(series, labels, opts){ opts=opts||{}; const W=opts.w||660,H=opts.h||230,pl=44,pr=16,pt=18,pb=34,iw=W-pl-pr,ih=H-pt-pb;
  let all=[]; series.forEach(s=>s.points.forEach(p=>{ if(p.y!=null&&!isNaN(p.y))all.push(p.y); })); if(opts.target!=null&&!isNaN(opts.target))all.push(Number(opts.target));
  if(!all.length) return '<div class="chart-empty">لا توجد بيانات كافية لعرض الاتجاه — تحتاج شهرًا واحدًا على الأقل</div>';
  let mn=Math.min(...all),mx=Math.max(...all); if(mn===mx){mn-=1;mx+=1;} const pd=(mx-mn)*0.12; mn-=pd; mx+=pd; if(mn>0&&mn<(mx-mn)*0.5)mn=0;
  const n=labels.length, X=i=>pl+(n<=1?iw/2:iw*i/(n-1)), Y=v=>pt+ih*(1-(v-mn)/(mx-mn));
  let grid=''; for(let g=0;g<=4;g++){ const yy=pt+ih*g/4, val=mx-(mx-mn)*g/4; grid+=`<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W-pr}" y2="${yy.toFixed(1)}" stroke="var(--line)"/><text x="${pl-6}" y="${(yy+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--soft)">${Math.round(val*10)/10}</text>`; }
  let xl=''; labels.forEach((l,i)=>{ xl+=`<text x="${X(i).toFixed(1)}" y="${H-12}" text-anchor="middle" font-size="10" fill="var(--soft)">${esc(l)}</text>`; });
  let tg=''; if(opts.target!=null&&!isNaN(opts.target)){ const ty=Y(Number(opts.target)); tg=`<line x1="${pl}" y1="${ty.toFixed(1)}" x2="${W-pr}" y2="${ty.toFixed(1)}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-pr}" y="${(ty-5).toFixed(1)}" text-anchor="end" font-size="10" fill="#a9781f">المستهدف ${opts.target}</text>`; }
  let paths=''; series.forEach(s=>{ const pts=s.points.filter(p=>p.y!=null&&!isNaN(p.y)); if(!pts.length)return;
    const d=pts.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ');
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach(p=>paths+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.6" fill="#fff" stroke="${s.color}" stroke-width="2"/>`); });
  const legend=series.length>1?`<div class="chart-legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" preserveAspectRatio="xMidYMid meet">${grid}${tg}${paths}${xl}</svg>${legend}`;
}
function spark(values,color){ const v=values.filter(x=>x!=null&&!isNaN(x)); if(v.length<2)return'<span class="spark-na">—</span>'; const W=68,H=22; let mn=Math.min(...v),mx=Math.max(...v); if(mn===mx){mn-=1;mx+=1;} const X=i=>i/(v.length-1)*W, Y=y=>H-3-(H-6)*(y-mn)/(mx-mn); const d=v.map((y,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join(' '); return `<svg width="${W}" height="${H}" class="spark"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function gaugeSVG(v,color){ v=Math.max(0,Math.min(100,Number(v)||0)); const c=2*Math.PI*40,off=c*(1-v/100); return `<svg width="92" height="92" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" fill="none" stroke="var(--sand)" stroke-width="9"/><circle cx="48" cy="48" r="40" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 48 48)"/></svg>`; }
function pxGauge(v,label){ const has=(v!=null&&v!==''); const col=has?pxColor(Number(v)):'var(--soft)'; return `<div class="px-gauge"><div class="g-wrap">${gaugeSVG(has?v:0,col)}<div class="g-c"><b style="color:${col}">${has?v+'%':'—'}</b></div></div><span>${label}</span></div>`; }
function distBar(g,nr,b){ const tot=g+nr+b||1; return `<div class="dist-bar"><span style="width:${g/tot*100}%;background:var(--green)"></span><span style="width:${nr/tot*100}%;background:var(--amber)"></span><span style="width:${b/tot*100}%;background:var(--red)"></span></div>`; }

/* ---- main dashboard reflection ---- */
function indDash(){ const m=indActive(); if(!m) return '';
  const px=m.px||{}, kpis=m.kpis||[]; let g=0,nr=0,b=0,na=0;
  kpis.forEach(k=>{ const s=kpiStat(k.value,k.target); s==='good'?g++:s==='near'?nr++:s==='bad'?b++:na++; });
  const sc=monthScore(m), asc=indMonthsAsc(), idx=indActiveIdx();
  const prevScore=idx>0?monthScore(asc[idx-1]):null;
  const scoreSpark=spark(asc.map(monthScore),scoreColor(sc||0));
  let momArrow=''; if(prevScore!=null&&sc!=null){ const d=sc-prevScore; momArrow=`<span class="mom" style="color:${d>=0?'var(--green)':'var(--red)'}">${d>0?'▲':d<0?'▼':'▬'} ${d>0?'+':''}${d}</span>`; }
  const watch=kpis.filter(k=>kpiStat(k.value,k.target)==='bad').slice(0,5);
  return `<div class="card" style="margin-bottom:18px"><div class="card-h"><svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" width="18" height="18"><path d="M3 3v18h18M7 14l4-4 3 3 5-6"/></svg> أداء المستشفى — ${esc(m.label)} <a onclick="go('indicators')" style="margin-inline-start:auto;font-size:11.5px;color:var(--petrol-l);cursor:pointer">التفاصيل ←</a></div>
    <div class="card-pad">
      <div class="exec-strip">
        <div class="exec-score"><div class="es-num" style="color:${scoreColor(sc||0)}">${sc!=null?sc:'—'}<small>/100</small></div><div class="es-lbl">مؤشر الأداء العام ${momArrow}</div><div class="es-spark">${scoreSpark}</div></div>
        <div class="exec-dist">${distBar(g,nr,b)}<div class="dist-legend"><span><i style="background:var(--green)"></i>ضمن ${g}</span><span><i style="background:var(--amber)"></i>قريب ${nr}</span><span><i style="background:var(--red)"></i>خارج ${b}</span></div></div>
        <div class="exec-px">${pxGauge(px.er,'الطوارئ')}${pxGauge(px.ip,'التنويم')}${pxGauge(px.op,'العيادات')}</div>
      </div>
      ${watch.length?`<div class="fail-list"><div class="fl-h">قائمة المتابعة (خارج المستهدف):</div>${watch.map(k=>`<div class="fl-item"><span class="dot" style="background:var(--red)"></span><span>${esc(k.name)}</span>${momentum(k.name,k.target)}<b style="margin-inline-start:auto">${fmtVal(k)}</b></div>`).join('')}</div>`:''}
    </div></div>`;
}

/* ---- indicators page ---- */
function renderIndicators(){ const c=$('#cInd'); if(c)c.textContent=indMonths().length;
  const ms=indMonths(), m=indActive(), ed=canEdit(), asc=indMonthsAsc();
  const head=`<div class="page-head"><div><h2>مؤشرات اللجنة</h2><p>متابعة أداء المؤشرات مقابل المستهدف واتجاهها عبر الأشهر</p></div>
    ${ed?`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="uploadQFR()">${icUp} رفع QFR</button><button class="btn ghost" onclick="openMonthModal()">${ic.plus} شهر يدويًا</button></div>`:''}</div>`;
  if(!ms.length){ $('#page-indicators').innerHTML=head+`<div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 8v4M12 16h.01"/></svg>
    ارفع ملف QFR الشهري لتُستخرج المؤشرات تلقائيًا، ثم أدخِل نسب تجربة المريض. ولرؤية الاتجاهات، ارفع شهرين أو ثلاثة سابقة.</div>
    <div class="card"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3v18h18M7 14l4-4 3 3 5-6"/></svg><p>لا توجد بيانات مؤشرات بعد</p></div></div>`; return; }
  const sel=`<select class="month-sel" onchange="selectIndMonth(this.value)">${ms.map(x=>`<option value="${x.id}" ${m&&x.id===m.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select>`;
  const px=m.px||{}, kpis=m.kpis||[]; let g=0,nr=0,b=0; kpis.forEach(k=>{const s=kpiStat(k.value,k.target); s==='good'?g++:s==='near'?nr++:s==='bad'&&b++;});
  const sc=monthScore(m);

  // domains
  const byDom={}; kpis.forEach(k=>{ const d=kpiDomain(k.name); (byDom[d.key]=byDom[d.key]||{t:d.t,items:[]}).items.push(k); });
  const domHTML=DOMAINS.concat([{key:'other',t:'مؤشرات أخرى'}]).filter(d=>byDom[d.key]).map(d=>{
    const its=byDom[d.key].items; let dg=0,dn=0,db=0; its.forEach(k=>{const s=kpiStat(k.value,k.target);s==='good'?dg++:s==='near'?dn++:s==='bad'&&db++;});
    const rows=its.map(k=>{ const s=kpiStat(k.value,k.target), st=STAT[s];
      return `<tr onclick="setDrill('${esc(k.name).replace(/'/g,"\\'")}')" style="cursor:pointer">
        <td><span class="sdot" style="background:${st.c}"></span>${esc(k.name)}</td>
        <td><b>${fmtVal(k)}</b> ${momentum(k.name,k.target)}</td>
        <td style="font-size:12px;color:var(--muted)">${esc(k.target||'—')}</td>
        <td>${spark(kpiTrend(k.name).map(p=>p.value),st.c)}</td>
        <td><span class="chip ${st.chip}">${st.t}</span></td></tr>`; }).join('');
    return `<div class="dom-card"><div class="dom-h"><b>${esc(d.t)}</b><span class="dom-mini">${distBar(dg,dn,db)}</span><span class="dom-count">${its.length} مؤشر</span></div>
      <div class="tbl-wrap"><table class="dom-tbl"><tbody>${rows}</tbody></table></div></div>`;
  }).join('');

  // drill chart
  const allNames=kpis.map(k=>k.name); const drill=(state.indicators.drillKpi&&allNames.includes(state.indicators.drillKpi))?state.indicators.drillKpi:(allNames[0]||'');
  const drillK=kpis.find(k=>k.name===drill);
  const drillTarget=drillK?(drillK.target.match(/\d+(?:\.\d+)?/)||[])[0]:null;
  const drillChart=drill?svgLine([{color:'var(--petrol)',label:drill,points:kpiTrend(drill).map((p,i)=>({x:i,y:p.value}))}],asc.map(x=>x.label),{target:drillTarget!=null?Number(drillTarget):null}):'';

  // overall + px charts
  const idxChart=svgLine([{color:scoreColor(sc||0),label:'المؤشر العام',points:asc.map((x,i)=>({x:i,y:monthScore(x)}))}],asc.map(x=>x.label),{w:660,h:200});
  const pxChart=svgLine([
    {color:'#c0492f',label:'الطوارئ',points:asc.map((x,i)=>({x:i,y:(x.px&&x.px.er!=null)?x.px.er:null}))},
    {color:'#2b6f8f',label:'التنويم',points:asc.map((x,i)=>({x:i,y:(x.px&&x.px.ip!=null)?x.px.ip:null}))},
    {color:'#2f8f5b',label:'العيادات الخارجية',points:asc.map((x,i)=>({x:i,y:(x.px&&x.px.op!=null)?x.px.op:null}))},
  ],asc.map(x=>x.label),{w:660,h:200});

  $('#page-indicators').innerHTML=head+`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap"><label style="font-size:13px;color:var(--muted);font-weight:600">الشهر المعروض:</label>${sel}
      ${ed?`<div style="margin-inline-start:auto;display:flex;gap:6px"><button class="btn ghost sm" onclick="openMonthModal('${m.id}')">${ic.edit} تعديل</button><button class="btn ghost sm" onclick="delMonth('${m.id}')">${ic.del} حذف</button></div>`:''}</div>

    <div class="exec-strip card" style="margin-bottom:18px;padding:18px 22px">
      <div class="exec-score"><div class="es-num" style="color:${scoreColor(sc||0)}">${sc!=null?sc:'—'}<small>/100</small></div><div class="es-lbl">مؤشر الأداء العام</div></div>
      <div class="exec-dist">${distBar(g,nr,b)}<div class="dist-legend"><span><i style="background:var(--green)"></i>ضمن ${g}</span><span><i style="background:var(--amber)"></i>قريب ${nr}</span><span><i style="background:var(--red)"></i>خارج ${b}</span></div></div>
      <div class="exec-px">${pxGauge(px.er,'الطوارئ')}${pxGauge(px.ip,'التنويم')}${pxGauge(px.op,'العيادات')}</div>
    </div>

    <div class="chart-grid">
      <div class="card"><div class="card-h">مؤشر الأداء العام عبر الأشهر</div><div class="card-pad">${idxChart}</div></div>
      <div class="card"><div class="card-h">اتجاه تجربة المريض</div><div class="card-pad">${pxChart}</div></div>
    </div>

    <div class="card" style="margin:18px 0"><div class="card-h">اتجاه مؤشر مقابل مستهدفه
      <select class="month-sel" style="margin-inline-start:auto;min-width:200px" onchange="setDrill(this.value)">${allNames.map(nm=>`<option ${nm===drill?'selected':''}>${esc(nm)}</option>`).join('')}</select></div>
      <div class="card-pad">${drillChart}</div></div>

    <div class="section-lbl" style="margin:20px 0 12px">الأداء حسب المجال</div>
    ${domHTML}`;
}
function setDrill(name){ state.indicators.drillKpi=name; touch(); setTimeout(()=>{ const el=$('#page-indicators'); if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'}); },10); }
function selectIndMonth(id){ state.indicators.activeId=id; touch(); }

/* ---- upload + month management ---- */
function loadSheetJS(){ return new Promise((res,rej)=>{ if(window.XLSX)return res(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>res(); s.onerror=()=>rej(); document.head.appendChild(s); }); }
function parseQFR(wb){ const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}); const out=[]; let name=null;
  rows.forEach(r=>{ const c0=String(r[0]||'').trim(),c1=String(r[1]||'').trim();
    if(c1==='HS'&&c0&&!c0.startsWith('KPI Result')) name=c0;
    if(c0.startsWith('KPI Result')){ const unit=/Rate/i.test(c0)?'rate':'%'; const raw=r[1]; let v='';
      if(typeof raw==='number') v=unit==='%'?Math.round(raw*1000)/10:Math.round(raw*100)/100;
      if(name) out.push({name,value:v,unit,target:String(r[2]||'').trim()}); name=null; } });
  return out; }
async function uploadQFR(){ toast('جارٍ تحميل أداة قراءة Excel...');
  try{ await loadSheetJS(); }catch(e){ toast('تعذّر التحميل — يلزم اتصال إنترنت. استخدم الإدخال اليدوي.'); return; }
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const wb=XLSX.read(new Uint8Array(r.result),{type:'array'}); const parsed=parseQFR(wb); const label=(wb.SheetNames[0]||'').trim()||'شهر جديد';
      openMonthModal(null,{label,kpis:parsed}); toast('تم استخراج '+parsed.length+' مؤشر — راجِع واحفظ'); }
      catch(e){ toast('تعذّر قراءة الملف'); } };
    r.readAsArrayBuffer(f); };
  inp.click(); }
function numv(idv){ const e=document.getElementById(idv); if(!e||e.value==='')return null; const n=Number(e.value); return isNaN(n)?null:n; }
function openMonthModal(id,seed){ const m=id?indMonths().find(x=>x.id===id):(seed||{}); const px=m.px||{};
  window._mk=(m.kpis||(seed&&seed.kpis)||[]).map(k=>({...k}));
  const kpiList=window._mk.map((k,i)=>`<tr><td style="font-size:12px">${esc(k.name)}</td><td><input id="mk_${i}" value="${k.value===''||k.value==null?'':esc(String(k.value))}" style="width:80px;padding:5px 7px;border:1px solid var(--line);border-radius:6px"></td><td style="font-size:11px;color:var(--soft)">${esc(k.target||'')}</td></tr>`).join('');
  openModal(id?'تعديل شهر':'حفظ بيانات الشهر',`
    <div class="form-grid">
      <div class="fld"><label>اسم الشهر</label><input id="mo_label" value="${esc(m.label||(seed&&seed.label)||'')}" placeholder="مثال: مايو 2026"></div>
      <div class="fld"><label>تاريخ الشهر</label><input type="date" id="mo_iso" value="${m.monthISO||''}"></div>
    </div>
    <div class="section-lbl">تجربة المريض (٣ نسب %)</div>
    <div class="form-grid">
      <div class="fld"><label>رضى مرضى الطوارئ %</label><input type="number" id="px_er" min="0" max="100" value="${px.er!=null?px.er:''}"></div>
      <div class="fld"><label>رضى التنويم %</label><input type="number" id="px_ip" min="0" max="100" value="${px.ip!=null?px.ip:''}"></div>
      <div class="fld"><label>رضى العيادات الخارجية %</label><input type="number" id="px_op" min="0" max="100" value="${px.op!=null?px.op:''}"></div>
    </div>
    ${window._mk.length?`<div class="section-lbl">مؤشرات QFR (${window._mk.length}) — يمكن تعديل القيم</div><div class="tbl-wrap" style="max-height:300px"><table><thead><tr><th>المؤشر</th><th>القيمة</th><th>المستهدف</th></tr></thead><tbody>${kpiList}</tbody></table></div>`:'<div class="section-lbl">مؤشرات QFR</div><p style="color:var(--soft);font-size:13px;margin:0">لا مؤشرات — ارفع ملف QFR لتعبئتها تلقائيًا، أو احفظ تجربة المريض فقط.</p>'}
  `,`<button class="btn ghost" onclick="closeModal()">إلغاء</button><button class="btn" onclick="saveMonth('${id||''}')">حفظ الشهر</button>`,true);
}
function saveMonth(id){ const label=val('mo_label')||'شهر'; const monthISO=val('mo_iso');
  const px={er:numv('px_er'),ip:numv('px_ip'),op:numv('px_op')};
  const kpis=(window._mk||[]).map((k,i)=>{ const e=document.getElementById('mk_'+i); let v=e?e.value.trim():(k.value==null?'':k.value); if(v!==''&&v!=null){const n=Number(v); v=isNaN(n)?v:n;} return {name:k.name,unit:k.unit,target:k.target,value:v}; });
  state.indicators=state.indicators||{months:[]};
  if(id){ const mm=state.indicators.months.find(x=>x.id===id); if(mm)Object.assign(mm,{label,monthISO,px,kpis}); }
  else { const nm={id:uid(),label,monthISO:monthISO||todayISO(),px,kpis,uploadedAt:new Date().toISOString()}; state.indicators.months.push(nm); state.indicators.activeId=nm.id; }
  closeModal(); touch(); toast('تم حفظ مؤشرات الشهر');
}
function delMonth(id){ if(!confirm('حذف بيانات هذا الشهر؟'))return; state.indicators.months=state.indicators.months.filter(x=>x.id!==id); touch(); }

/* ---------- boot ---------- */
load(); renderAll(); syncTopbarHeight(); checkLinked();
/* الافتراضي: وضع الأيقونات على الشاشات الضيقة، والوضع الكامل على الشاشات الواسعة */
(function initRail(){ let pref=null; try{ pref=localStorage.getItem('navRail'); }catch(e){}
  toggleRail(pref!==null ? pref==='1' : window.matchMedia('(max-width:920px)').matches); })();
window.addEventListener('resize',syncTopbarHeight,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(syncTopbarHeight,250),{passive:true});
window.addEventListener('keydown',e=>{ if(e.key==='Escape') toggleNav(false); });
window.addEventListener('beforeprint',()=>{ toggleNav(false); document.querySelectorAll('.page').forEach(p=>p.classList.toggle('print-show',p.classList.contains('show'))); });
window.addEventListener('afterprint',()=>{ document.querySelectorAll('.page').forEach(p=>p.classList.remove('print-show')); });
</script>
