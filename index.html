<script id="committeeData" type="application/json">{"meta":{"id":"mpy74b6njpf1_xls_20260719104149","savedAt":"2026-07-27T07:05:15.360Z","schema":2,"excelImport":{"file":"متابعة مهام الاجتماع الاسبوعي (1).xlsx","sheet":"Sheet1","importedRows":27,"importedAt":"2026-07-19T10:41:49.396875Z"}},"identity":{"name":"اللجنة التنفيذية","type":"لجنة سلامة المرضى","objective":"1.\tالعمل كقوة توجيهية ومنفذة لمبادرات الجودة وسلامة المرضى.\n2.\tضمان تنفيذ خطة الجودة ومعايير المستشفى.\n3.\tالموافقة على جميع مبادرات الجودة والإشراف على برنامج الجودة وسلامة المرضى.","scope":"1.\tالموافقة على جميع مبادرات إدارة الجودةوتوفير الإشراف على برنامج إدارة الجودة.\n2.\tمراجعة الأهداف ومراقبتها ، لتكون بمثابة مؤشر لمختلف الخدمات السريرية وخدمات الدعم لضمان تحديد الممارسة القائمة على الأدلة وفقا للخطة الاستراتيجية للمستشفى.\n3.\tالموافقة على جميع الفرق على مستوى المستشفى التي تم تشكيلها لحل مشكلة محددة.\n4.\tمراجعة فعالية برنامج تحسين الجودة / الأداء سنويا وإجراء التعديلات عند الضرورة.\n5.\tالتأكد من وجود دليل السياسات والإجراءات التشغيلية في جميع أقسام المستشفى ويتحمل مسؤولية مراجعة وتحديث الأدلة حسب الضرورة.\n6.\tتلقي تقرير من اللجان الأخرى بناء على هيكل اللجنة.\n7.\tوضع معايير المركز السعودي لاعتماد المنشآت الصحية في جميع الإدارات ومراقبة تقدمها.\n8.\tتطوير وتنفيذ مجموعة مختارة من مؤشرات المستشفى لتحليل الاتجاه و PDCA كما هو معتمد وفقا لمعايير المركز السعودي لاعتماد المنشآت الصحية\n9.\tتقديم تقارير إلى مجلس الإدارة على أساس ربع سنوي.\n10.\tالتطوير والإشراف على تنفيذ برنامج متكامل لسلامة المرضى بالمستشفيات ومتابعة النظام الذي يشمل الطاقم الطبي وموظفي جميع الأقسام من خلال ما يلي:\n10.1\tإنشاء آلية على مستوى المستشفى حول كيفية تنفيذبرنامج سلامة المرضى.\n10.2\tتطوير ومراجعة وتنقيح السياسات المتعلقة بسلامة المرضى في المستشفى.\n10.3\tإنشاء تقييم مستمر لتحديد أي مشكلات محتملة تتعلق بسلامة المرضى لمنع / تقليل حدوثها بشكل استباقي.\n11.\tمراقبة الالتزام بتدابير سلامة المرضى:\n11.1\tإجراء مسح سلامة المرضى لتقييم ممارسة وفعالية خطة سلامة المرضى.\n11.2\tمراجعة قضايا ومخاوف سلامة المرضى (الأحداث الضائرة والأخطاء الوشيكة) وتحديد مسار العمل المناسب لمنع حدوثها.\n11.3\tتطوير أنشطة استباقية أخرى للحد من الحدوث وفقا للاحتياجات المحددة.\n12.\tتعزيز وعي الموظفين ودعم احتياجات التعليم والتدريب للمنظمة المتعلقة بسلامة المرضى.\n13.\tتعزيز نظام يشجع المرضى على إدراك دورهم في الحفاظ على بيئة آمنة.\n14.\tتقييم وتعديل برنامج سلامة المرضى في المستشفى سنويا، وحسب الضرورة.","formationRef":"21112","formationDate":"2026-06-04","termStart":"2026-06-04","termEnd":"2027-12-31","frequency":"monthly","quorumType":"percent","quorumValue":50,"coordinator":"صالح ناصر الزيد","respText":"جدولة مواعيد الاجتماع باوقات ثابتة","authText":"متابعة مشاريع التحسين","standardAgenda":[{"id":"mpz9h4ta69vu","text":"مناقشة مشاريع التحسين"},{"id":"mpz9h4tads2g","text":"تفاصيل وضع الاعتماد ونسبة الالتزام لحاملي الملفات"},{"id":"mpz9h4taxxue","text":"عرض أهم المؤشرات"},{"id":"mpz9h4tax8bb","text":"مناقشة المؤشرات"},{"id":"mpz9h4tammnl","text":"مناقشة مشاريع التسحين"},{"id":"mpz9h4tagxhd","text":"ادارة المخاطر"}]},"responsibilities":[{"id":"mpz656wims6f","text":"جدولة مواعيد الاجتماع باوقات ثابتة"}],"authorities":[{"id":"mpz65s5fabmm","text":"متابعة مشاريع التحسين"}],"members":[{"name":"صالح ناصر الزيد","role":"منسق اللجنة","dept":"الجودة وسلامة المرضى","contact":"snalzaid@moh.gov.sa","voting":true,"id":"mpz63qzkrq37"},{"name":"تركي علي المطيري","role":"رئيس اللجنة","dept":"إدارة المستشفى","contact":"tualalmutairi@moh.gov.sa","voting":true,"id":"mpz64y08dve0"},{"id":"xls_member_001","name":"عبدالرحمن المساعد","role":"عضو","dept":"تجربة المريض","contact":"","voting":false,"source":"متابعة مهام الاجتماع الاسبوعي (1).xlsx"},{"id":"xls_member_002","name":"متعب المطيري","role":"عضو","dept":"العيادات","contact":"","voting":false,"source":"متابعة مهام الاجتماع الاسبوعي (1).xlsx"},{"id":"xls_member_003","name":"ماجد الحسيني","role":"عضو","dept":"الصيانة","contact":"","voting":false,"source":"متابعة مهام الاجتماع الاسبوعي (1).xlsx"},{"id":"xls_member_004","name":"خالد الغيامه","role":"عضو","dept":"المختبر","contact":"", <style>
:root{
  --petrol:#0e4d59; --petrol-d:#0a3a43; --petrol-l:#15616d;
  --sand:#f5f1e8; --paper:#ffffff; --line:#e3ddcf;
  --ink:#1b2b2e; --muted:#6c7a7c; --soft:#92a0a1;
  --amber:#c8922e; --amber-l:#f3e6c8;
  --green:#2f8f5b; --green-l:#e0f0e6;
  --red:#c0492f; --red-l:#f7e3dd;
  --blue:#2b6f8f; --blue-l:#dcebf1;
  --shadow:0 1px 2px rgba(14,77,89,.06),0 8px 24px rgba(14,77,89,.07);
  --shadow-lg:0 12px 48px rgba(10,58,67,.18);
  --r:14px; --r-sm:9px;
  --topbar-h:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--topbar-h) + 12px)}
body{
  font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:linear-gradient(160deg,#f7f4ec 0%,#eef0ea 100%);
  color:var(--ink); line-height:1.6; font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::selection{background:var(--amber-l)}

/* ---------- Header ---------- */
.topbar{
  background:linear-gradient(120deg,var(--petrol-d),var(--petrol) 60%,var(--petrol-l));
  color:#fff; padding:14px 26px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  box-shadow:var(--shadow); position:sticky; top:0; z-index:40;
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand .mark{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:rgba(255,255,255,.12); display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.18);
}
.brand .mark svg{width:24px;height:24px}
.brand h1{font-size:17px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.brand .sub{font-size:11.5px;opacity:.72;font-weight:300;letter-spacing:.2px}
.ctype-badge{
  font-size:11px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);
  padding:3px 10px;border-radius:20px;white-space:nowrap;
}
.toolbar{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16);
  padding:8px 13px;border-radius:9px;font-size:13px;font-weight:500;transition:.18s;
}
.tbtn:hover{background:rgba(255,255,255,.2)}
.tbtn svg{width:15px;height:15px}
.tbtn.primary{background:var(--amber);border-color:var(--amber)}
.tbtn.primary:hover{background:#b3801f}
.tbtn.primary.linked{position:relative}
.tbtn.primary.linked::after{content:"";position:absolute;top:-3px;inset-inline-start:-3px;width:11px;height:11px;border-radius:50%;background:#3ddc84;border:2px solid var(--petrol)}
.mode-pill{display:flex;background:rgba(0,0,0,.18);border-radius:9px;padding:3px;gap:2px}
.mode-pill button{padding:6px 12px;border-radius:7px;color:#cfe0e2;font-size:12.5px;font-weight:500}
.mode-pill button.on{background:#fff;color:var(--petrol)}

/* ---------- Layout ---------- */
.shell{display:flex;min-height:calc(100dvh - var(--topbar-h))}
.nav{
  width:228px;flex-shrink:0;padding:18px 12px;
  background:var(--paper);border-inline-start:1px solid var(--line);
  position:sticky;top:var(--topbar-h);align-self:flex-start;height:calc(100dvh - var(--topbar-h));overflow:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  transition:width .22s cubic-bezier(.2,.8,.2,1),padding .22s ease;
}
/* --- collapsed rail (desktop) --- */
.nav-collapse{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;margin-bottom:8px;
  border-radius:10px;background:var(--sand);border:1px solid var(--line);color:var(--muted);
  font-size:12px;font-weight:600;transition:.15s}
.nav-collapse:hover{background:#ece6d8;color:var(--petrol-d)}
.nav-collapse svg{width:16px;height:16px;flex-shrink:0;transition:transform .22s ease}
.nav-collapse .nc-txt{white-space:nowrap;overflow:hidden}
body.nav-rail .nav{width:66px;padding-inline:9px}
body.nav-rail .nav .lbl{opacity:0;height:0;padding:0;overflow:hidden;margin:6px 0}
body.nav-rail .nav a{justify-content:center;padding:11px 0;gap:0;position:relative;font-size:0}
body.nav-rail .nav a>svg{width:20px;height:20px}
body.nav-rail .nav a .count{position:absolute;top:3px;inset-inline-end:5px;margin:0;font-size:9.5px;
  padding:0 5px;line-height:15px;min-width:15px;text-align:center}
body.nav-rail .nav-collapse{justify-content:center;padding-inline:0}
body.nav-rail .nav-collapse .nc-txt{display:none}
body.nav-rail .nav-collapse svg{transform:scaleX(-1)}
.nav-backdrop{display:none}
.nav .lbl{font-size:11px;color:var(--soft);font-weight:600;padding:8px 12px 6px;letter-spacing:.3px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:var(--ink);font-size:14px;font-weight:500;margin-bottom:2px;transition:.15s;
  border:1px solid transparent;
}
.nav a svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.nav a:hover{background:var(--sand)}
.nav a.active{background:var(--petrol);color:#fff}
.nav a.active svg{color:#fff}
.nav a .count{margin-inline-start:auto;font-size:11px;background:var(--sand);color:var(--muted);padding:1px 8px;border-radius:10px;font-weight:600}
.nav a.active .count{background:rgba(255,255,255,.2);color:#fff}
.main{flex:1;padding:28px 34px;max-width:1460px;min-width:0;width:100%}

/* ---------- Generic ---------- */
.page{display:none;animation:fade .3s ease}
.page.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h2{font-size:24px;font-weight:700;color:var(--petrol-d)}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:2px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:22px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;color:var(--petrol-d);display:flex;align-items:center;gap:9px}
.card-h svg{width:18px;height:18px;color:var(--amber)}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--petrol);color:#fff;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.16s}
.btn:hover{background:var(--petrol-l)}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--sand);color:var(--petrol-d);border:1px solid var(--line)}
.btn.ghost:hover{background:#ece6d8}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{background:var(--red)} .btn.danger:hover{background:#a53c25}

.empty{text-align:center;padding:46px 20px;color:var(--soft)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:12px}
.empty p{font-size:14px}

table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:11.5px;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1.5px solid var(--line);background:#fbfaf6;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fcfbf7}
.tbl-wrap{overflow:auto;border-radius:var(--r);-webkit-overflow-scrolling:touch}
.tbl-wrap table{min-width:680px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px}
.chip.green{background:var(--green-l);color:#1f6e42}
.chip.amber{background:var(--amber-l);color:#8a6212}
.chip.red{background:var(--red-l);color:#9c3a23}
.chip.blue{background:var(--blue-l);color:#1e5670}
.chip.gray{background:#eceae3;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%}

.iconbtn{width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);transition:.15s}
.iconbtn:hover{background:var(--sand);color:var(--petrol)}
.iconbtn.del:hover{background:var(--red-l);color:var(--red)}
.iconbtn svg{width:16px;height:16px}
.row-actions{display:flex;gap:2px;justify-content:flex-end}

/* ---------- Dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:16px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .k-top{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .k-top svg{width:16px;height:16px}
.kpi .k-val{font-size:30px;font-weight:700;color:var(--petrol-d);margin-top:8px;line-height:1}
.kpi .k-val small{font-size:14px;color:var(--soft);font-weight:500}
.kpi .k-sub{font-size:11.5px;color:var(--soft);margin-top:6px}
.gauge-card{display:flex;align-items:center;gap:22px}
.gauge{position:relative;width:128px;height:128px;flex-shrink:0}
.gauge svg{transform:rotate(0)}
.gauge .g-num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge .g-num b{font-size:34px;color:var(--petrol-d);line-height:1}
.gauge .g-num span{font-size:11px;color:var(--soft)}
.health-bars{flex:1;display:flex;flex-direction:column;gap:11px}
.hb{display:flex;flex-direction:column;gap:4px}
.hb .hb-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.hb .hb-top b{color:var(--ink);font-weight:600}
.hb .track{height:7px;background:var(--sand);border-radius:5px;overflow:hidden}
.hb .fill{height:100%;border-radius:5px;transition:width .6s ease}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.mini-item{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
.mini-item:last-child{border-bottom:none}
.mini-item .mi-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.mini-item .mi-body{flex:1;min-width:0}
.mini-item .mi-body b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-item .mi-body span{font-size:11.5px;color:var(--soft)}
.mini-item.clickable{cursor:pointer;transition:background .15s,box-shadow .15s}
.mini-item.clickable:hover{background:var(--sand)}
.mini-item.clickable:focus-visible{outline:2px solid var(--petrol);outline-offset:-2px}
.mini-item .mi-go{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--soft);flex-shrink:0;opacity:.45;transition:.15s}
.mini-item .mi-go svg{width:15px;height:15px}
.mini-item.clickable:hover .mi-go{opacity:1;color:var(--petrol);background:#fff}

/* ---------- Forms / list editors ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:600;color:var(--petrol-d)}
.fld label .hint{font-weight:400;color:var(--soft);font-size:11px}
.fld input,.fld select,.fld textarea{
  padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fdfcf9;
  color:var(--ink);transition:.15s;width:100%;
}
.fld textarea{resize:vertical;min-height:86px;line-height:1.7}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--petrol-l);background:#fff;box-shadow:0 0 0 3px rgba(21,97,109,.1)}
.fld input:disabled,.fld textarea:disabled,.fld select:disabled{background:#f3f1ea;color:var(--muted);cursor:not-allowed}
.hijri-tag{font-size:11px;color:var(--amber);font-weight:600}

.listedit{display:flex;flex-direction:column;gap:9px}
.listedit .le-row{display:flex;align-items:flex-start;gap:10px;background:#fbfaf6;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.listedit .le-num{width:24px;height:24px;border-radius:7px;background:var(--petrol);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0;margin-top:1px}
.listedit .le-row textarea{flex:1;border:none;background:none;resize:none;min-height:24px;padding:2px 0;color:var(--ink);line-height:1.6}
.listedit .le-row textarea:focus{outline:none}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(11,40,46,.55);backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center;padding:24px;animation:fade .2s}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .25s ease}
.modal.wide{max-width:840px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-h{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--paper);z-index:2}
.modal-h h3{font-size:18px;font-weight:700;color:var(--petrol-d)}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--paper)}
.x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.x:hover{background:var(--sand)}
.section-lbl{font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.4px;margin:22px 0 12px;padding-bottom:7px;border-bottom:1px dashed var(--line)}
.section-lbl:first-child{margin-top:0}

/* attendance grid */
.att-list{display:flex;flex-direction:column;gap:8px}
.att-row{display:flex;align-items:center;gap:12px;padding:10px 13px;background:#fbfaf6;border:1px solid var(--line);border-radius:10px}
.att-row .nm{flex:1;font-size:13.5px;font-weight:500}
.att-row .nm small{display:block;color:var(--soft);font-weight:400;font-size:11px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:12px;color:var(--muted);font-weight:600;transition:.12s}
.seg button.on-p{background:var(--green);color:#fff}
.seg button.on-a{background:var(--red);color:#fff}
.seg button.on-e{background:var(--amber);color:#fff}

.matrix td,.matrix th{text-align:center;padding:9px 8px;font-size:12px}
.matrix th:first-child,.matrix td:first-child{text-align:start;position:sticky;inset-inline-start:0;background:#fbfaf6;font-weight:600}
.mx{width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.mx.p{background:var(--green)} .mx.a{background:var(--red)} .mx.e{background:var(--amber)} .mx.n{background:#dcd8cd;color:var(--soft)}

.callout{display:flex;gap:12px;background:var(--amber-l);border:1px solid #e7d3a0;border-radius:12px;padding:14px 16px;font-size:13px;color:#7a5810;margin-bottom:18px}
.callout svg{width:20px;height:20px;flex-shrink:0;color:var(--amber)}
.quorum-flag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px}
.quorum-flag.ok{background:var(--green-l);color:#1f6e42}
.quorum-flag.no{background:var(--red-l);color:#9c3a23}

/* evidence / checklist */
.check-list{display:flex;flex-direction:column;gap:0}
.check-item{display:flex;align-items:center;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line)}
.check-item:last-child{border-bottom:none}
.check-item .ci-box{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.check-item .ci-box.pass{background:var(--green);color:#fff}
.check-item .ci-box.fail{background:var(--red-l);color:var(--red)}
.check-item .ci-box svg{width:15px;height:15px}
.check-item .ci-txt{flex:1}
.check-item .ci-txt b{font-size:13.5px;font-weight:600;display:block}
.check-item .ci-txt span{font-size:12px;color:var(--soft)}

.toast{position:fixed;bottom:26px;inset-inline-start:50%;transform:translateX(50%) translateY(120px);background:var(--petrol-d);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);z-index:100;transition:.4s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(50%) translateY(0)}
.toast svg{width:18px;height:18px;color:var(--amber)}

.setup-hint{background:linear-gradient(120deg,var(--petrol),var(--petrol-l));color:#fff;border-radius:var(--r);padding:22px 26px;margin-bottom:22px;display:flex;gap:18px;align-items:center}
.setup-hint svg{width:38px;height:38px;flex-shrink:0;opacity:.9}
.setup-hint b{font-size:16px;display:block;margin-bottom:3px}
.setup-hint p{font-size:13px;opacity:.85}

/* in-minutes capture */
.capture-row{display:flex;flex-direction:column;gap:9px;background:#fbfaf6;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-bottom:9px}
.capture-row .cr-top{display:flex;align-items:flex-start;gap:10px}
.capture-row .cr-num{width:24px;height:24px;border-radius:7px;background:var(--amber);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:2px}
.capture-row.task .cr-num{background:var(--blue)}
.capture-row textarea{flex:1;border:none;background:none;resize:none;min-height:24px;line-height:1.6;color:var(--ink);font-size:13.5px;padding:2px 0;font-family:inherit}
.capture-row textarea:focus{outline:none}
.capture-row .cr-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding-inline-start:34px}
.capture-row .cr-meta input,.capture-row .cr-meta select{padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;color:var(--ink)}
.capture-row .cr-meta .mlbl{font-size:11px;color:var(--soft)}
/* PM tasks */
.task-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tstat{flex:1;min-width:110px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow)}
.tstat b{font-size:24px;font-weight:700;display:block;line-height:1.1}
.tstat span{font-size:12px;color:var(--muted)}
.view-toggle{display:flex;background:var(--sand);border-radius:9px;padding:3px;gap:2px}
.view-toggle button{padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.view-toggle button.on{background:var(--paper);color:var(--petrol);box-shadow:var(--shadow)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:14px;align-items:start;
  overflow-x:auto;overflow-y:visible;padding-bottom:10px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.kanban>.kcol{scroll-snap-align:start}
.kanban::-webkit-scrollbar{height:9px}
.kanban::-webkit-scrollbar-track{background:rgba(14,77,89,.05);border-radius:10px}
.kanban::-webkit-scrollbar-thumb{background:#cfd6d2;border-radius:10px}
.kanban::-webkit-scrollbar-thumb:hover{background:var(--soft)}
.kanban{scrollbar-width:thin;scrollbar-color:#cfd6d2 rgba(14,77,89,.05)}
.kcol{background:#f2f0e9;border:1px solid var(--line);border-top:3px solid var(--kc,var(--soft));
  border-radius:16px;padding:0 10px 10px;min-height:90px;min-width:0}
.kcol-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--petrol-d);
  padding:12px 12px 10px;margin:0 -10px 4px;border-bottom:1px solid rgba(0,0,0,.05);min-width:0}
.kcol-h .kc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kcol-h .kc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.kcol-h .kc-n{margin-inline-start:auto;font-size:11px;background:rgba(0,0,0,.06);padding:1px 9px;border-radius:10px;color:var(--muted);font-weight:600}
.kcol-empty{text-align:center;color:var(--soft);font-size:12px;padding:20px 0;border:1px dashed #ddd8c8;border-radius:11px}

.tcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(14,77,89,.05);cursor:pointer;transition:box-shadow .16s,transform .16s,border-color .16s;
  border-inline-start:3px solid var(--soft);overflow:hidden}
.tcard:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:#d5cfbe}
.tcard.pri-high{border-inline-start-color:var(--red)} .tcard.pri-medium{border-inline-start-color:var(--blue)} .tcard.pri-low{border-inline-start-color:var(--soft)}
.tcard.overdue{background:#fdf6f3;border-color:#eed6cd}
.tcard .tc-body{padding:12px 13px}
.tcard .tc-top{display:flex;align-items:center;gap:6px;margin-bottom:8px;min-height:20px}
.tcard .tc-dept{font-size:10.5px;font-weight:600;color:var(--petrol);background:#e8f0f1;padding:2px 8px;border-radius:6px;
  max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .tc-pri{margin-inline-start:auto;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.tcard .tc-pri.red{background:var(--red-l);color:#9c3a23} .tcard .tc-pri.blue{background:var(--blue-l);color:#1e5670}
.tcard .tc-pri.gray{background:#eceae3;color:var(--muted)}
.tcard .tc-txt{font-size:13.5px;font-weight:600;line-height:1.55;margin-bottom:10px;color:var(--ink);overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;line-clamp:3;overflow:hidden}
.tcard .tc-meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);min-width:0}
.tcard .tc-meta .tc-owner{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;color:var(--ink)}
.tcard .tc-dates{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--soft);margin-top:9px}
.tcard .tc-dates .dl{display:inline-flex;align-items:center;gap:4px}
.tcard .tc-dates svg{width:12px;height:12px;flex-shrink:0}
.tcard .tc-notes{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2;overflow:hidden}
.tcard .tc-src{font-size:10.5px;color:var(--soft);margin-top:8px;display:flex;align-items:center;gap:4px}
.tcard .tc-src svg{width:11px;height:11px;flex-shrink:0}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--petrol);color:#fff;display:inline-grid;place-items:center;font-size:10px;font-weight:700;flex-shrink:0}

.tc-prog-wrap{display:flex;align-items:center;gap:8px;margin-top:10px}
.tc-prog{height:6px;background:#eeebe1;border-radius:4px;overflow:hidden;flex:1;margin:0}
.tc-prog .pf{height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.tc-prog-wrap .pnum{font-size:10.5px;font-weight:700;color:var(--muted);min-width:30px;text-align:end;font-variant-numeric:tabular-nums}

.tc-move{display:flex;gap:5px;flex-wrap:wrap;padding:0 13px;background:#fafaf6;border-top:1px solid var(--line);
  max-height:0;opacity:0;overflow:hidden;transition:max-height .2s ease,opacity .16s ease,padding .2s ease}
.tcard:hover .tc-move,.tcard:focus-within .tc-move{max-height:120px;opacity:1;padding:9px 13px}
.tc-move button{flex:1 1 auto;min-width:56px;font-size:10.5px;padding:5px 7px;border-radius:7px;background:var(--sand);
  color:var(--muted);font-weight:600;border:1px solid var(--line);transition:.12s}
.tc-move button:hover{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.tc-move button.arch{flex:0 0 auto}
.tc-move button.del{flex:0 0 auto;min-width:48px;background:#fbeeea;color:var(--red);border-color:#f0d7cf}
.tc-move button.del:hover{background:var(--red);color:#fff;border-color:var(--red)}
@media(hover:none){.tc-move{max-height:120px;opacity:1;padding:9px 13px}}

.due-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;background:var(--sand);font-size:10.5px;color:var(--muted)}
.due-pill.late{background:var(--red-l);color:var(--red);font-weight:700}
.progress-input{display:flex;align-items:center;gap:10px}
.progress-input input[type=range]{flex:1;accent-color:var(--petrol)}
/* grouped recs */
.rec-group{margin-bottom:18px}
.rec-group .rg-h{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--petrol-d);padding:8px 4px 10px}
.rec-group .rg-h svg{width:17px;height:17px;color:var(--amber);flex-shrink:0}
.rec-group .rg-h .rg-date{font-weight:400;color:var(--soft);font-size:12px}
.rec-point{display:flex;gap:13px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow)}
.rec-point .rp-num{width:28px;height:28px;border-radius:8px;background:var(--amber-l);color:#8a6212;font-weight:700;display:grid;place-items:center;flex-shrink:0;font-size:13px}
.rec-point .rp-body{flex:1;min-width:0}
.rec-point .rp-txt{font-size:14px;font-weight:600;line-height:1.7;color:var(--ink)}
.rec-point .rp-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}
.rec-point .rp-meta .chip .avatar{margin-inline-end:2px}
/* الأعمدة الخمسة تتقاسم العرض بالكامل؛ التمرير الأفقي يبدأ فقط عندما تضيق الشاشة فعليًا */
@media(max-width:1080px){.kanban{grid-auto-columns:minmax(212px,1fr)}}
@media(max-width:920px){.kanban{grid-auto-columns:minmax(232px,1fr)}}
/* fixed agenda picker */
.agenda-pick{display:flex;align-items:center;gap:10px;padding:10px 13px;background:#fbfaf6;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;font-size:13.5px;cursor:pointer;transition:.15s}
.agenda-pick:hover{background:#f3f1ea}
.agenda-pick.on{background:var(--green-l);border-color:#bfe0cc}
.agenda-pick input{width:17px;height:17px;accent-color:var(--petrol);flex-shrink:0;cursor:pointer}
.agenda-pick.other.on{background:var(--amber-l);border-color:#e7d3a0}
.other-note{width:100%;padding:9px 12px;border:1.5px solid #e7d3a0;border-radius:9px;background:#fff;margin:0 0 7px;font-size:13px;font-family:inherit}
.other-note:focus{outline:none;box-shadow:0 0 0 3px rgba(200,146,46,.15)}
/* rec quick controls */
.rp-quick{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.rp-quick .qf{display:flex;flex-direction:column;gap:3px}
.rp-quick .qf label{font-size:10.5px;color:var(--soft);font-weight:600}
.rp-quick select,.rp-quick input{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px;color:var(--ink);font-family:inherit}
.rp-quick .qsel{font-weight:600}
.rp-quick .qsel.s-amber{color:#8a6212;border-color:#e7d3a0;background:var(--amber-l)}
.rp-quick .qsel.s-blue{color:#1e5670;border-color:#bcd6e2;background:var(--blue-l)}
.rp-quick .qsel.s-green{color:#1f6e42;border-color:#bfe0cc;background:var(--green-l)}
.rp-quick .qsel.s-gray{color:var(--muted);background:#eceae3}
.rp-quick input.due-late{border-color:var(--red);color:var(--red)}
/* item cards in minutes */
.item-card{background:#fbfaf6;border:1.5px solid var(--line);border-radius:13px;margin-bottom:12px;overflow:hidden}
.item-card.on{border-color:var(--petrol);border-inline-start:4px solid var(--petrol)}
.item-hdr{display:flex;align-items:center;gap:10px;padding:13px 16px;background:rgba(14,77,89,.04)}
.item-hdr input{width:17px;height:17px;accent-color:var(--petrol);flex-shrink:0;cursor:pointer}
.item-title{font-size:14.5px;font-weight:700;color:var(--petrol-d)}
.item-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px}
.item-lbl{font-size:12px;font-weight:700;color:var(--amber);display:block;margin-bottom:6px;letter-spacing:.3px}
.item-sec{display:flex;flex-direction:column;gap:6px}
.item-empty{color:var(--soft);font-size:12px;margin:0;padding:4px 0}
/* monthly indicators (pro) */
.px-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.px-gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.px-gauge .g-wrap{position:relative;width:92px;height:92px}
.px-gauge .g-c{position:absolute;inset:0;display:grid;place-items:center}
.px-gauge .g-c b{font-size:20px;font-weight:700}
.px-gauge span{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.exec-strip{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.exec-score{text-align:center;min-width:120px}
.exec-score .es-num{font-size:42px;font-weight:700;line-height:1}
.exec-score .es-num small{font-size:15px;color:var(--soft);font-weight:500}
.exec-score .es-lbl{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;display:flex;gap:6px;align-items:center;justify-content:center}
.exec-score .es-spark{margin-top:4px}
.exec-dist{flex:1;min-width:180px}
.dist-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--sand)}
.dist-bar span{height:100%}
.dist-legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.dist-legend i,.chart-legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:5px}
.exec-px{display:flex;gap:14px}
.mom{font-size:12px;font-weight:700}
.fail-list{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}
.fail-list .fl-h{font-size:12px;font-weight:700;color:var(--red);margin-bottom:8px}
.fail-list .fl-item{display:flex;align-items:center;gap:9px;font-size:13px;padding:6px 0}
.month-sel{padding:9px 13px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;font-weight:600;color:var(--petrol-d);min-width:150px;font-family:inherit}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-svg{width:100%;height:auto;display:block}
.chart-empty{padding:40px 16px;text-align:center;color:var(--soft);font-size:13px}
.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.spark{vertical-align:middle}.spark-na{color:var(--soft)}
.dom-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.dom-h{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);background:#fbfaf6}
.dom-h b{font-size:14.5px;color:var(--petrol-d)}
.dom-mini{width:120px} .dom-mini .dist-bar{height:9px}
.dom-count{margin-inline-start:auto;font-size:11.5px;color:var(--soft)}
.dom-tbl td{padding:11px 14px;font-size:13px}
.dom-tbl tr:hover td{background:#fcfbf7}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:8px;vertical-align:middle}
@media(max-width:920px){.chart-grid{grid-template-columns:1fr}.exec-strip{gap:16px}.exec-px{width:100%;justify-content:space-around}}
@media print{
  .topbar,.nav,.toolbar,.btn,.iconbtn,.row-actions,.mode-pill,.tbtn{display:none!important}
  .shell{display:block} .main{max-width:none;padding:0}
  body{background:#fff}
  .page{display:none!important} .page.print-show{display:block!important}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .kanban{display:block;overflow:visible}
  .kcol{break-inside:avoid;margin-bottom:12px}
  .tc-move{display:none!important}
  .tcard{break-inside:avoid}
}
@media(max-width:920px){
  .topbar{padding:10px 12px;gap:10px;align-items:center}
  .brand{flex:1 1 auto;min-width:0;gap:10px}
  .brand .mark{width:38px;height:38px;border-radius:10px}
  .brand h1{font-size:15px;max-width:calc(100vw - 178px)}
  .brand .sub{font-size:10.5px}
  .ctype-badge{font-size:10.5px;padding:2px 8px}
  .toolbar{width:100%;margin-inline-start:0;justify-content:space-between;gap:6px}
  .mode-pill{flex:1 1 auto;min-width:172px}
  .mode-pill button{flex:1;padding:6px 8px;font-size:11.5px;white-space:nowrap}
  .tbtn{padding:7px 10px;font-size:12px;border-radius:8px;white-space:nowrap}
  .tbtn svg{width:14px;height:14px}
  .shell{display:flex;min-height:calc(100dvh - var(--topbar-h))}
  .dash-grid{grid-template-columns:1fr 1fr}
  .two-col{grid-template-columns:1fr}
  /* الشريط الجانبي يبقى ظاهرًا دائمًا — يتنقّل بين وضع كامل ووضع أيقونات */
  .nav{width:min(64vw,250px);padding:14px 10px}

<body class="">

    <a title="متابعة المهام" data-tab="tasks" onclick="go('tasks')" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path></svg>المهام<span class="count" id="cTasks">13</span></a>
    <a title="المؤشرات الشهرية" data-tab="indicators" onclick="go('indicators')" class=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18M7 14l4-4 3 3 5-6"></path></svg>المؤشرات<span class="count" id="cInd">3</span></a>

  <main class="main">

<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal wide" id="modal"></div>
</div>
<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"></path></svg>تم حفظ المهمة</div>

<script>
/* =================================================================
   متابعة مؤشرات ومهام اللجنة التنفيذية
   البيانات تُخزَّن داخل هذا الملف (JSON مضمّن) + حفظ تلقائي احتياطي
   ================================================================= */

const TYPES = ["لجنة مكافحة العدوى","لجنة سلامة المرضى","لجنة الجودة وتحسين الأداء",
"لجنة الدواء والعلاجيات","لجنة الوفيات والمراضة","لجنة السجلات الطبية","لجنة نقل الدم",
"لجنة الكوارث والطوارئ","لجنة إدارة النفايات الطبية","لجنة حقوق المريض والأخلاقيات",
"لجنة السلامة والصحة المهنية","لجنة التغذية الإكلينيكية","لجنة التثقيف الصحي","أخرى"];

const ROLES = ["رئيس اللجنة","نائب الرئيس","منسق اللجنة","أمين السر","عضو"];
const FREQ = {weekly:{n:52,t:"أسبوعي"},biweekly:{n:26,t:"كل أسبوعين"},monthly:{n:12,t:"شهري"},
  bimonthly:{n:6,t:"كل شهرين"},quarterly:{n:4,t:"ربع سنوي"},semiannual:{n:2,t:"نصف سنوي"},annual:{n:1,t:"سنوي"}};
const REC_STATUS = {open:"مفتوحة",progress:"قيد التنفيذ",done:"منفّذة",closed:"مغلقة"};
const TASK_STATUS = {todo:"لم تبدأ",progress:"قيد التنفيذ",blocked:"متعثّرة",done:"منجزة",cancelled:"ملغاة"};
const TASK_COL = {todo:{t:"لم تبدأ",c:"#92a0a1"},progress:{t:"قيد التنفيذ",c:"#2b6f8f"},blocked:{t:"متعثّرة",c:"#c0492f"},done:{t:"منجزة",c:"#2f8f5b"},cancelled:{t:"ملغاة",c:"#6c7a7c"}};
const PRIORITY = {high:{t:"عالية",c:"red"},medium:{t:"متوسطة",c:"blue"},low:{t:"منخفضة",c:"gray"}};
const normPri = p => PRIORITY[p]?p:(p==='normal'?'medium':'medium');
const initials = n => (n||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('')||'؟';

let state, mode='coordinator', taskView='board', taskScope='active';

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hijri(iso){ if(!iso) return '—';
  try{ return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso))+' هـ'; }catch(e){ return '—'; } }
function greg(iso){ if(!iso) return '—';
  try{ return new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso)); }catch(e){ return iso; } }
const todayISO = ()=>new Date().toISOString().slice(0,10);
function isOverdue(iso,status){ return iso && status!=='done' && status!=='closed' && status!=='cancelled' && iso < todayISO(); }

/* ---------- state ---------- */
function blankState(){ return {
  meta:{id:uid(),savedAt:null,schema:1},
  identity:{name:"",type:"",objective:"",scope:"",formationRef:"",formationDate:"",
    termStart:"",termEnd:"",frequency:"monthly",quorumType:"percent",quorumValue:50,coordinator:""},
  responsibilities:[], authorities:[], members:[], meetings:[], recommendations:[], tasks:[], indicators:{months:[]}
};}

function load(){
  let embedded=null;
  try{ embedded = JSON.parse($('#committeeData').textContent.trim()); }catch(e){}
  let ls=null;
  try{ const raw=embedded? localStorage.getItem('committee_'+embedded.meta.id):null; if(raw) ls=JSON.parse(raw); }catch(e){}
  if(embedded && ls && ls.meta.savedAt && embedded.meta.savedAt && ls.meta.savedAt>embedded.meta.savedAt) state=ls;
  else if(embedded) state=embedded;
  else state=blankState();
  // ensure arrays exist
  ['responsibilities','authorities','members','meetings','recommendations','tasks'].forEach(k=>{ if(!Array.isArray(state[k])) state[k]=[]; });
  state.tasks.forEach(t=>{
    if(t.archived===undefined)t.archived=false;
    if(t.archivedAt===undefined)t.archivedAt='';
    if(t.department===undefined)t.department='';
    if(t.startG===undefined)t.startG='';
    if(t.notes===undefined)t.notes='';
    if(t.sourceStartText===undefined)t.sourceStartText='';
    if(t.sourceDueText===undefined)t.sourceDueText='';
  });
  if(!state.indicators||typeof state.indicators!=='object') state.indicators={months:[]};
  if(!Array.isArray(state.indicators.months)) state.indicators.months=[];
  // migrate responsibilities/authorities -> text under objective
  if(state.identity.respText===undefined)
    state.identity.respText = state.responsibilities.map(x=>x&&x.text).filter(Boolean).join('\n');
  if(state.identity.authText===undefined)
    state.identity.authText = state.authorities.map(x=>x&&x.text).filter(Boolean).join('\n');
  // establish fixed standard agenda (approved items) + remap legacy meeting agendas
  if(!Array.isArray(state.identity.standardAgenda)){
    const seen={}, std=[];
    state.meetings.forEach(m=>(m.agenda||[]).forEach(a=>{ const tx=(a&&a.text||'').trim(); if(tx&&!seen[tx]){ seen[tx]={id:uid(),text:tx}; std.push(seen[tx]); } }));
    state.identity.standardAgenda=std;
    state.meetings.forEach(m=>{ m.agenda=(m.agenda||[]).map(a=>{ const tx=(a&&a.text||'').trim(); const s=seen[tx]; return s?{id:s.id,text:s.text}:(tx?{id:'other',text:'بند آخر',note:tx}:null); }).filter(Boolean); });
  }
  // migrate old m.minutes → first agenda item discussion
  state.meetings.forEach(mt=>{
    if(mt.minutes&&(mt.minutes.discussion||mt.minutes.decisions)&&mt.agenda&&mt.agenda.length&&!mt.agenda.some(a=>a.discussion)){
      mt.agenda[0].discussion=(mt.minutes.discussion||'')+(mt.minutes.decisions?'\n\nالقرارات:\n'+mt.minutes.decisions:'');
    }
  });
}
function isDocumented(m){ return (m.agenda||[]).some(a=>a.discussion); }
let saveTimer;
function autosave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ try{ localStorage.setItem('committee_'+state.meta.id, JSON.stringify(state)); }catch(e){} },400); }
function touch(){ autosave(); renderAll(); }

/* ---------- file save (data embedded in HTML) ---------- */
/* ---- save directly into the file (File System Access API) ---- */
let fileHandle=null;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('committeeFS',1); r.onupgradeneeded=()=>r.result.createObjectStore('h'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(r=>{ const t=db.transaction('h').objectStore('h').get(k); t.onsuccess=()=>r(t.result||null); t.onerror=()=>r(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idb(); db.transaction('h','readwrite').objectStore('h').put(v,k); }catch(e){} }
async function ensurePerm(h){ try{ const o={mode:'readwrite'}; if((await h.queryPermission(o))==='granted')return true; return (await h.requestPermission(o))==='granted'; }catch(e){ return false; } }
function buildSaveHTML(){
  state.meta.savedAt=new Date().toISOString();
  try{ localStorage.setItem('committee_'+state.meta.id, JSON.stringify(state)); }catch(e){}
  const clone=document.documentElement.cloneNode(true);
  clone.querySelectorAll('.page').forEach(p=>p.innerHTML='');
  clone.querySelectorAll('script[src*="xlsx"]').forEach(s=>s.remove());
  clone.querySelector('#overlay').classList.remove('show');
  clone.querySelector('body')?.classList.remove('nav-open');
  clone.querySelector('body')?.classList.remove('nav-rail');
  clone.querySelector('#nav')?.classList.remove('open');
  clone.querySelector('#navToggle')?.setAttribute('aria-expanded','false');
  clone.querySelector('#committeeData').textContent=JSON.stringify(state);
  return '<!DOCTYPE html>\n'+clone.outerHTML;
}
function downloadHTML(html,note){
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a'); const nm=(state.identity.name||'لجنة').replace(/[\\/:*?"<>|]/g,'').trim()||'لجنة';
  a.href=URL.createObjectURL(blob); a.download=nm+'.html'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast(note||'تم تنزيل نسخة محدّثة من الملف');
}
async function saveFile(){
  const html=buildSaveHTML();
  if(!window.showSaveFilePicker){ downloadHTML(html,'متصفحك لا يدعم الحفظ المباشر — تم تنزيل نسخة محدّثة'); return; }
  try{
    if(!fileHandle){ const stored=await idbGet(state.meta.id); if(stored && await ensurePerm(stored)) fileHandle=stored; }
    if(!fileHandle){
      fileHandle=await window.showSaveFilePicker({ suggestedName:(state.identity.name||'لجنة')+'.html',
        types:[{description:'ملف لجنة (HTML)',accept:{'text/html':['.html']}}] });
      await idbSet(state.meta.id,fileHandle);
    } else if(!await ensurePerm(fileHandle)){ downloadHTML(html,'تعذّر الوصول للملف — تم تنزيل نسخة بدلاً من ذلك'); return; }
    const w=await fileHandle.createWritable(); await w.write(html); await w.close();
    setLinked(true); toast('تم حفظ التعديلات داخل الملف');
  }catch(e){
    if(e&&e.name==='AbortError'){ toast('أُلغيت عملية الحفظ'); return; }
    downloadHTML(html,'تعذّر الحفظ المباشر — تم تنزيل نسخة محدّثة');
  }
}
function setLinked(on){ const b=document.getElementById('saveBtn'); if(b) b.classList.toggle('linked',!!on); }
async function checkLinked(){ if(!window.showSaveFilePicker)return; const stored=await idbGet(state.meta.id); if(stored)setLinked(true); }

/* ---------- ui basics ---------- */
function toast(msg){ const t=$('#toast'); t.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>'+esc(msg); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function syncTopbarHeight(){
  const bar=document.querySelector('.topbar');
  if(!bar) return;
  document.documentElement.style.setProperty('--topbar-h', Math.ceil(bar.getBoundingClientRect().height)+'px');
}
/* الشريط الجانبي ظاهر دائمًا: زر واحد ينقله بين الوضع الكامل ووضع الأيقونات */
function toggleRail(force){
  const rail = typeof force === 'boolean' ? force : !document.body.classList.contains('nav-rail');
  document.body.classList.toggle('nav-rail',rail);
  const b=$('#navCollapse');
  if(b){ b.setAttribute('aria-expanded', rail?'false':'true');
    b.title = rail?'توسيع الشريط الجانبي':'تصغير الشريط الجانبي';
    b.setAttribute('aria-label',b.title); }
  const t=$('#navToggle');
  if(t) t.setAttribute('aria-expanded', rail?'false':'true');
  try{ localStorage.setItem('navRail', rail?'1':'0'); }catch(e){}
}
/* أُبقيت للتوافق مع الاستدعاءات القديمة (Escape / الطباعة / التنقل بين الصفحات) */
function toggleNav(force){ if(force===false) return; toggleRail(); }
function go(tab){
  const page=$('#page-'+tab);
  if(!page) return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  page.classList.add('show');
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.tab===tab));
  toggleNav(false);
  window.scrollTo({top:0,behavior:'smooth'});
}
function setMode(m){ mode=m; $('#modeEdit').classList.toggle('on',m==='coordinator'); $('#modeView').classList.toggle('on',m==='view'); renderAll(); }
const canEdit=()=>mode==='coordinator';

function closeModal(){ $('#overlay').classList.remove('show'); $('#modal').innerHTML=''; }
function openModal(title,bodyHTML,footHTML,wide){
  $('#modal').className='modal'+(wide?' wide':'');
  $('#modal').innerHTML=`<div class="modal-h"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">${bodyHTML}</div>${footHTML?`<div class="modal-foot">${footHTML}</div>`:''}`;
  $('#overlay').classList.add('show');
}
const ic={edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6"/></svg>',
  tcStart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  tcDue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  tcDoc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6"/></svg>'};
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

/* =====================================================================
   RENDER
   ===================================================================== */
function renderAll(){
  $('#hdrName').textContent = state.identity.name || 'متابعة اللجنة';
  const tb=$('#hdrType'); if(state.identity.type){tb.style.display='';tb.textContent=state.identity.type;} else tb.style.display='none';
  const cT=$('#cTasks'); if(cT) cT.textContent=state.tasks.filter(t=>!t.archived&&t.status!=='done'&&t.status!=='cancelled').length;
  renderDash(); renderTasks(); renderIndicators();
  setTimeout(syncTopbarHeight,0);
}

/* ---- metrics ---- */
function metrics(){
  const active=state.tasks.filter(t=>!t.archived);
  const done=active.filter(t=>t.status==='done').length;
  const prog=active.filter(t=>t.status==='progress').length;
  const blocked=active.filter(t=>t.status==='blocked').length;
  const overdue=active.filter(t=>isOverdue(t.dueG,t.status)).length;
  const closure=active.length? Math.round(active.filter(t=>t.status==='done'||t.status==='cancelled').length/active.length*100):0;
  const month=indActive();
  const indScore=month?monthScore(month):null;
  const kpis=month?(month.kpis||[]):[];
  let g=0,nr=0,b=0;
  kpis.forEach(k=>{ const s=kpiStat(k.value,k.target); s==='good'?g++:s==='near'?nr++:s==='bad'&&b++; });
  const health=Math.round((closure*.45)+((indScore!=null?indScore:0)*.55));
  return {active:active.length,done,prog,blocked,overdue,closure,indScore,indGood:g,indNear:nr,indBad:b,health,monthLabel:month?month.label:''};
}

/* ---- Meetings ---- */
function quorumCheck(m){
  const voters=state.members.filter(x=>x.voting!==false);
  const present=voters.filter(v=>(m.attendance||{})[v.id]==='present').length;
  const need = state.identity.quorumType==='percent' ? Math.ceil(voters.length*state.identity.quorumValue/100) : state.identity.quorumValue;
  return {present,need,total:voters.length,ok: voters.length>0 && present>=need};
}

  if(!$('#page-meetings')) return;

function delMeeting(id){ if(!confirm('حذف هذا الاجتماع ومحضره؟')) return; state.meetings=state.meetings.filter(x=>x.id!==id); touch(); }

function meetingDetail(id){
  const m=state.meetings.find(x=>x.id===id); const q=quorumCheck(m); const ed=canEdit();
  const std=state.identity.standardAgenda||[];
  const att=state.members.map(mem=>{ const s=(m.attendance||{})[mem.id]||'';
    return `<div class="att-row"><div class="nm">${esc(mem.name)}<small>${esc(mem.role||'عضو')}${mem.voting===false?' · بدون تصويت':''}</small></div>
    <div class="seg">
      <button class="${s==='present'?'on-p':''}" ${ed?`onclick="setAtt('${id}','${mem.id}','present')"`:'disabled'}>حاضر</button>
      <button class="${s==='excused'?'on-e':''}" ${ed?`onclick="setAtt('${id}','${mem.id}','excused')"`:'disabled'}>معتذر</button>
      <button class="${s==='absent'?'on-a':''}" ${ed?`onclick="setAtt('${id}','${mem.id}','absent')"`:'disabled'}>غائب</button>
    </div></div>`; }).join('');
  // per-item cards
  function itemCard(aItem,isOther){
    const itemRecs=state.recommendations.filter(r=>r.meetingId===id&&r.agendaItemId===aItem.id);
    const itemTasks=state.tasks.filter(t=>t.meetingId===id&&t.agendaItemId===aItem.id);
    const title=isOther?('بند آخر'+(aItem.note?' — '+esc(aItem.note):'')) : esc(aItem.text);
    return `<div class="item-card on"><div class="item-hdr">
        <input type="checkbox" checked ${ed?`onchange="${isOther?`toggleOther('${id}')`:`toggleAgenda('${id}','${aItem.id}')`}"`:'disabled'}>
        <span class="item-title">${title}</span>
        <span style="margin-inline-start:auto;font-size:11px;color:var(--soft)">${itemRecs.length} توصية · ${itemTasks.length} مهمة</span>
      </div><div class="item-body">
        ${isOther?`<div class="fld"><label class="item-lbl">وصف البند</label><input class="other-note" ${ed?'':'disabled'} value="${esc(aItem.note||'')}" oninput="updOtherNote('${id}',this.value)" placeholder="وصف موجز..."></div>`:''}
        <div class="fld"><label class="item-lbl">المناقشة</label>
          <textarea id="disc_${aItem.id}" ${ed?'':'disabled'} placeholder="ملخص ما دار من نقاش حول هذا البند..." style="min-height:70px">${esc(aItem.discussion||'')}</textarea></div>
        <div class="item-sec"><label class="item-lbl">التوصيات</label>
          ${itemRecs.map((r,i)=>captureRecRow(id,r,i)).join('')||`<p class="item-empty">لا توصيات لهذا البند</p>`}
          ${ed?`<button class="btn ghost sm" style="margin-top:4px" onclick="addRecRow('${id}','${aItem.id}')">${ic.plus} توصية</button>`:''}</div>
        <div class="item-sec"><label class="item-lbl">المهام</label>
          ${itemTasks.map((t,i)=>captureTaskRow(id,t,i)).join('')||`<p class="item-empty">لا مهام لهذا البند</p>`}
          ${ed?`<button class="btn ghost sm" style="margin-top:4px" onclick="addTaskRow('${id}','${aItem.id}')">${ic.plus} مهمة</button>`:''}</div>
      </div></div>`; }
  const selIds=(m.agenda||[]).map(a=>a.id);
  const unselected=std.filter(s=>!selIds.includes(s.id));
  const otherSel=(m.agenda||[]).find(a=>a.id==='other');
  const selectedCards=(m.agenda||[]).filter(a=>a.id!=='other').map(a=>{
    const s=std.find(x=>x.id===a.id); return s ? itemCard(Object.assign({},a,{text:s.text}),false) : ''; }).join('');
  const otherCard=otherSel?itemCard(otherSel,true):'';
  const unselUI=unselected.length?`<div style="margin-top:12px"><div style="font-size:12px;color:var(--soft);margin-bottom:6px">بنود أخرى معتمدة (انقر لإضافتها):</div>`
    +unselected.map(s=>`<label class="agenda-pick"><input type="checkbox" ${ed?`onchange="toggleAgenda('${id}','${s.id}')"`:'disabled'}><span>${esc(s.text)}</span></label>`).join('')+'</div>':'';
  const otherToggle=!otherSel?`<label class="agenda-pick other" style="margin-top:6px"><input type="checkbox" ${ed?`onchange="toggleOther('${id}')"`:'disabled'}><span>بند آخر (استثناء مضبوط)</span></label>`:'';
  openModal('محضر: '+(m.title||'اجتماع'),`
    <div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 8v4M12 16h.01"/></svg>
      <div>التاريخ: <b>${greg(m.dateG)} — ${hijri(m.dateG)}</b><br>حالة النصاب: <b style="color:${q.ok?'var(--green)':'var(--red)'}">${q.ok?'مكتمل':'غير مكتمل'}</b> — حضر ${q.present} من أصل ${q.total} عضو مصوّت (المطلوب ${q.need})</div></div>
    <div class="section-lbl">تسجيل الحضور</div>
    <div class="att-list">${att||'<p style="color:var(--soft);font-size:13px">أضف أعضاء أولاً</p>'}</div>
    <div class="section-lbl">بنود جدول الأعمال والمناقشة</div>
    ${!std.length&&!otherSel?'<p style="color:var(--soft);font-size:13px">لا بنود معتمدة — أضِفها من التعريف والميثاق.</p>':''}
    ${selectedCards}${otherCard}${unselUI}${otherToggle}
  `,ed?`<button class="btn ghost" onclick="closeModal()">إغلاق</button><button class="btn" onclick="saveMinutes('${id}')">حفظ المحضر</button>`:`<button class="btn" onclick="closeModal()">إغلاق</button>`,true);
}
function stashMinutes(mid){ const m=state.meetings.find(x=>x.id===mid); if(!m)return;
  (m.agenda||[]).forEach(a=>{ const el=document.getElementById('disc_'+a.id); if(el) a.discussion=el.value; }); }
function setAtt(mid,memId,v){ stashMinutes(mid); const m=state.meetings.find(x=>x.id===mid); m.attendance=m.attendance||{};
  m.attendance[memId]=m.attendance[memId]===v?'':v; autosave(); meetingDetail(mid); }
function toggleAgenda(mid,sid){ stashMinutes(mid); const m=state.meetings.find(x=>x.id===mid); m.agenda=m.agenda||[];
  if(m.agenda.some(a=>a.id===sid)) m.agenda=m.agenda.filter(a=>a.id!==sid);
  else { const s=(state.identity.standardAgenda||[]).find(x=>x.id===sid); if(s) m.agenda.push({id:s.id,text:s.text,discussion:''}); }
  autosave(); meetingDetail(mid); }
function toggleOther(mid){ stashMinutes(mid); const m=state.meetings.find(x=>x.id===mid); m.agenda=m.agenda||[];
  if(m.agenda.some(a=>a.id==='other')) m.agenda=m.agenda.filter(a=>a.id!=='other');
  else m.agenda.push({id:'other',text:'بند آخر',note:'',discussion:''});
  autosave(); meetingDetail(mid); }
function updOtherNote(mid,v){ const m=state.meetings.find(x=>x.id===mid); const o=(m.agenda||[]).find(a=>a.id==='other'); if(o){o.note=v;autosave();} }

function delRecRow(mid,id){ stashMinutes(mid); state.recommendations=state.recommendations.filter(x=>x.id!==id); autosave(); meetingDetail(mid); }
function updRec(id,f,v){ const r=state.recommendations.find(x=>x.id===id); if(r){ r[f]=v; autosave(); } }
function quickRec(id,f,v){ const r=state.recommendations.find(x=>x.id===id); if(r){ r[f]=v; touch(); } }

function captureTaskRow(mid,t,i){ const ed=canEdit();
  return `<div class="capture-row task"><div class="cr-top"><div class="cr-num">${i+1}</div>
    <textarea ${ed?'':'disabled'} rows="1" oninput="updTask('${t.id}','text',this.value)" placeholder="وصف المهمة...">${esc(t.text)}</textarea>

    <div class="cr-meta">

      <span class="mlbl">الأولوية</span><select ${ed?'':'disabled'} onchange="updTask('${t.id}','priority',this.value)">${Object.entries(PRIORITY).map(([k,v])=>`<option value="${k}" ${k===normPri(t.priority)?'selected':''}>${v.t}</option>`).join('')}</select>
    </div></div>`; }
function addTaskRow(mid,aid){ stashMinutes(mid); state.tasks.push({id:uid(),text:'',owner:'',dueG:'',status:'todo',priority:'medium',progress:0,meetingId:mid,agendaItemId:aid}); autosave(); meetingDetail(mid); }
function delTaskRow(mid,id){ stashMinutes(mid); state.tasks=state.tasks.filter(x=>x.id!==id); autosave(); meetingDetail(mid); }
function updTask(id,f,v){ const t=state.tasks.find(x=>x.id===id); if(!t)return; t[f]=v; if(f==='status'){ if(v==='done')t.progress=100; else if(t.progress===100)t.progress=50; } autosave(); }

function saveMinutes(mid){ stashMinutes(mid); const m=state.meetings.find(x=>x.id===mid);
  const hasContent=(m.agenda||[]).some(a=>a.discussion||state.recommendations.some(r=>r.meetingId===mid&&r.agendaItemId===a.id)||state.tasks.some(t=>t.meetingId===mid&&t.agendaItemId===a.id));
  if(m.status==='planned'&&hasContent) m.status='held';
  closeModal(); touch(); toast('تم حفظ المحضر'); }

  const head=`<th>العضو</th>`+held.map(m=>`<th title="${esc(m.title)}">${greg(m.dateG).split(' ').slice(0,2).join(' ')}</th>`).join('')+`<th>النسبة</th>`;
  const body=state.members.map(mem=>{ const a=memberAttendance(mem.id);
    return `<tr><td>${esc(mem.name)}</td>`+held.map(m=>{ const s=(m.attendance||{})[mem.id];
      const map={present:['p','ح'],absent:['a','غ'],excused:['e','ع']}; const x=map[s]||['n','—'];
      return `<td><span class="mx ${x[0]}">${x[1]}</span></td>`; }).join('')+

  <div class="callout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM12 8v4M12 16h.01"/></svg>

}

        <span class="qf"><label>الاستحقاق</label><input type="date" value="${r.dueG||''}" onchange="quickRec('${r.id}','dueG',this.value)" class="${od?'due-late':''}"></span>

        <button class="iconbtn del" onclick="delRec('${r.id}')">${ic.del}</button>
      </div></div></div>`;
    return `<div class="rec-point"><div class="rp-num">${i+1}</div><div class="rp-body">

      <div class="rp-meta">

        ${r.owner?`<span class="chip gray"><span class="avatar" style="width:18px;height:18px;font-size:9px">${esc(initials(r.owner))}</span>${esc(r.owner)}</span>`:''}
        ${r.dueG?`<span class="due-pill ${od?'late':''}">الاستحقاق: ${greg(r.dueG)}${od?' — متأخرة':''}</span>`:''}
      </div></div></div>`; };

  const body = groups.length ? groups.map(g=>`
    <div class="rec-group">
      <div class="rg-h">${g.meeting?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> محضر: ${esc(g.meeting.title||'اجتماع')} <span class="rg-date">· ${greg(g.meeting.dateG)} — ${hijri(g.meeting.dateG)}</span>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg> توصيات غير مرتبطة باجتماع`}</div>

  $('#page-recs').innerHTML=`<div class="page-head"><div><h2>التوصيات</h2><p>التوصيات الصادرة عن محاضر الاجتماعات، مجمّعةً ومرقّمةً بصيغة رسمية</p></div></div>

  ${body}`;
}

/* ---- Tasks ---- */
function taskProg(t){ return t.progress!=null?t.progress:(t.status==='done'?100:0); }
function setTaskView(v){ taskView=v; renderTasks(); }
function setTaskScope(v){ taskScope=v; renderTasks(); }
function moveTask(id,s){ const t=state.tasks.find(x=>x.id===id); if(!t)return; t.status=s; if(s==='done')t.progress=100; else if(taskProg(t)===100)t.progress=50; touch(); }
function taskDateDisplay(t,kind){
  const iso=kind==='start'?t.startG:t.dueG;
  const raw=kind==='start'?t.sourceStartText:t.sourceDueText;
  if(iso)return greg(iso);
  return raw||'—';
}
function toggleTaskArchive(id){
  const t=state.tasks.find(x=>x.id===id); if(!t)return;
  t.archived=!t.archived; t.archivedAt=t.archived?new Date().toISOString():'';
  closeModal(); touch(); toast(t.archived?'تمت أرشفة المهمة':'تمت استعادة المهمة من الأرشيف');
}
function renderTasks(){
  const ed=canEdit();
  const active=state.tasks.filter(t=>!t.archived), archived=state.tasks.filter(t=>t.archived);
  const all=taskScope==='archived'?archived:active;
  const done=active.filter(t=>t.status==='done').length;
  const prog=active.filter(t=>t.status==='progress').length;
  const overdue=active.filter(t=>isOverdue(t.dueG,t.status)).length;
  const stats=`<div class="task-stats">
    <div class="tstat"><b style="color:var(--petrol-d)">${active.length}</b><span>المهام النشطة</span></div>
    <div class="tstat"><b style="color:var(--blue)">${prog}</b><span>قيد التنفيذ</span></div>

const icUp='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>';
const DOMAINS=[
 {key:'mortality', t:'الوفيات وسلامة المرضى', re:/mortality|sentinel/i},
 {key:'infection', t:'مكافحة العدوى', re:/cauti|clabsi|\bvae\b|ventilator|outbreak|pressure ulcer/i},
 {key:'readiness', t:'الجاهزية والإمداد', re:/readiness|preparedness|blood inventory|critical supplies|lab tat|radiology/i},
 {key:'ed', t:'الطوارئ', re:/\bed\b|emergency|door to|disposition|dama|lama|boarding|re-attended/i},
 {key:'flow', t:'تدفّق المرضى', re:/occupancy|length of stay|alos|readmission|re-admitted|\bbed\b|morgue|closure/i},
 {key:'opd', t:'العيادات والإحالات', re:/opd|referral|appointment|virtual|elective|waiting/i},
